[project]
name = "onboarding"
version = "0.1.0"
description = "Automated Employee Onboarding Workflow — catalog and agent handoff models"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
onboard = "onboarding.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
crew = [
    "crewai>=0.80.0; python_version < '3.14'",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["onboarding*"]
